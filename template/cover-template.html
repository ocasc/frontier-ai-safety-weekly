<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Frontier AI Safety Biweekly — cover template</title>
<!-- 900x383 cover card: render with scripts/render_cover.py -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 900px; height: 383px; background: #fff; overflow: hidden;
       font-family: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
       -webkit-font-smoothing: antialiased; }
.cover { position: relative; width: 900px; height: 383px; overflow: hidden; }
.date { position: absolute; left: 56px; top: 34px; font-size: 10.5px; letter-spacing: 2.6px; color: #9CA3AF; }
.brand { position: absolute; right: 56px; top: 38px; font-size: 10.5px; letter-spacing: 4px; color: #8A9099; font-weight: 600; text-align: right; }
.cn { position: absolute; right: 56px; top: 58px; font-size: 13px; letter-spacing: 3px; color: #16181D; font-weight: 600; text-align: right; }
h1 { position: absolute; left: 56px; top: 100px; font-size: 66px; line-height: 1.05; font-weight: 600; color: #16181D; }
.rule { position: absolute; left: 56px; top: 200px; width: 72px; height: 3px; background: #A25433; }
.sub { position: absolute; left: 56px; top: 228px; font-size: 15px; line-height: 1.8; color: #4B5563; }
.sub b { font-weight: 500; color: #16181D; }
.cats { position: absolute; right: 56px; bottom: 30px; text-align: right; font-size: 11px; letter-spacing: 1.4px; color: #6B7280; }
.cats i { display: inline-block; width: 5px; height: 5px; margin: 0 7px 2px 16px; }
</style>
</head>
<body>
<div class="cover">
  <div class="date">VOL.N · YYYY</div>
  <div class="brand">FRONTIER AI SAFETY BIWEEKLY</div>
  <div class="cn">前沿 AI 安全双周刊</div>
  <h1>本期主题标题</h1>
  <div class="rule"></div>
  <div class="sub">本期 N 篇：一句话主题（示例）<br><b>YYYY-MM-DD – YYYY-MM-DD</b></div>
  <!-- Order the category markers to match their first appearance in the issue. -->
  <div class="cats"><i style="background:#A25433"></i>错对齐与欺骗<i style="background:#3D5A94"></i>控制<i style="background:#4A6B57"></i>评估与审计<i style="background:#6B5B95"></i>可解释性<i style="background:#8A6A3B"></i>保证与标准</div>
</div>
</body>
</html>
