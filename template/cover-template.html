<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Frontier AI Safety Weekly — cover template</title>
<!-- 900x383 cover card: render with scripts/render_cover.py -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #23262A; width: 900px; height: 383px; }
  .cover { width: 900px; height: 383px; padding: 48px 54px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: 4px; color: #16181D; }
  .cover h1 { font-size: 38px; font-weight: 700; color: #16181D; line-height: 1.45; letter-spacing: 0.5px; }
  .cover .date { font-size: 16px; color: #8A9099; margin-top: 12px; }
  .pills { display: flex; gap: 12px; }
  .pill { font-size: 15px; font-weight: 700; color: #fff; padding: 7px 16px; border-radius: 999px; }
</style>
</head>
<body>
<div class="cover">
  <div class="brand">FRONTIER AI SAFETY WEEKLY</div>
  <div>
    <h1>本周 N 篇：一句话主题（示例）</h1>
    <div class="date">YYYY-MM-DD → MM-DD</div>
  </div>
  <!-- Category pills use the same colors as the issue body -->
  <div class="pills">
    <div class="pill" style="background:#A25433;">错对齐</div>
    <div class="pill" style="background:#3D5A94;">监督与控制</div>
    <div class="pill" style="background:#4A6B57;">安全案例</div>
  </div>
</div>
</body>
</html>
